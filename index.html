<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>16 a las 18</title>
<meta name="description" content="La app del grupo de pádel: anotados, sorteo, cuadro y ranking.">
<meta name="theme-color" content="#EEF6FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="16 a las 18">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}[hidden]{display:none!important}
/* Concepto Figurita: el grupo como un álbum de figuritas.
   Celeste claro de fondo con manchas coral y amarillas, fotos como figuritas con borde blanco y apenas inclinadas,
   todo redondeado (tarjetas de 24 a 34 px, botones píldora), tipografía gorda y redonda.
   Movimiento: las figuritas se "pegan" (sello con rebote suave); el botón principal se hunde al tocarlo. */
:root{
  --bg:#EEF6FF; --panel:#FFFFFF; --panel-2:#E4EDF8; --line:#DCE6F2; --line-solid:#B9C7DA;
  --ink:#0E1B3D; --muted:#4B5873; --dim:#66728C;
  --coral:#FF5E3A; --coral-d:#C2381C; --sun:#FFD84A; --sky:#9BE7FF; --peach:#FFC7B5; --lav:#D7CCFF; --mint:#B8F0D2;
  --up:#13804A; --down:#C2381C;
  --shadow:0 2px 4px rgba(14,27,61,.06),0 14px 30px rgba(14,27,61,.12);
  --display:"Unbounded","Arial Rounded MT Bold","Helvetica Neue",sans-serif;
  --text:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gut:max(16px,env(safe-area-inset-left,0px)); --gutr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%;display:block}
a{color:var(--ink)}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px;border-radius:12px}
.num{font-variant-numeric:tabular-nums}
.app{position:relative;max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px));background:var(--bg);overflow-x:hidden}
.muted{color:var(--muted)} .small{font-size:14px}
.lbl{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- manchas de fondo ---------- */
.blob{position:absolute;z-index:0;pointer-events:none}
.blob.b1{right:-90px;top:-40px;width:330px;height:320px;background:var(--coral);border-radius:62% 38% 55% 45%/48% 60% 40% 52%}
.blob.b2{left:-80px;top:360px;width:210px;height:200px;background:var(--sun);border-radius:50% 50% 46% 54%/55% 45% 55% 45%}
.blob.b3{right:-70px;top:-60px;width:240px;height:220px;background:var(--sun);border-radius:58% 42% 50% 50%/50% 55% 45% 50%}
.view{position:relative;animation:in .25s ease-out both}
.view>*{position:relative;z-index:1}
.view>.blob{position:absolute;z-index:0}
@keyframes in{from{opacity:.4}to{opacity:1}}

/* ---------- barra superior ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;height:64px;padding-left:var(--gut);padding-right:var(--gutr);
  background:rgba(238,246,255,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.mark{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:17px;margin-right:auto;white-space:nowrap}
.mark i{width:14px;height:14px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 3px #fff}
.chip-me{display:flex;align-items:center;gap:8px;height:42px;padding:0 4px 0 14px;border:0;border-radius:999px;background:#fff;box-shadow:0 4px 12px rgba(14,27,61,.12);font-weight:800;font-size:14px;max-width:150px;white-space:nowrap;overflow:hidden}
.chip-me .av{width:34px;height:34px;font-size:14px}
.ic-btn{position:relative;width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:50%;background:#fff;color:var(--ink);box-shadow:0 4px 12px rgba(14,27,61,.12)}
.ic-btn.org::after{content:"";position:absolute;top:4px;right:4px;width:12px;height:12px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px #fff}
.tag-org{display:none}
.demo-band{position:relative;z-index:1;margin:0 auto 4px;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:4px 12px;text-align:center}

/* ---------- navegación flotante ---------- */
.tabs{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;padding-left:var(--gut);padding-right:var(--gutr);pointer-events:none}
.tabs-in{pointer-events:auto;max-width:528px;margin:0 auto;height:64px;border-radius:999px;background:var(--ink);box-shadow:0 12px 30px rgba(14,27,61,.3);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;padding:0 7px}
.tab{height:50px;border:0;border-radius:999px;background:transparent;display:flex;align-items:center;justify-content:center;gap:6px;color:#C9D6EE;font-weight:800;font-size:14px;transition:background .2s}
.tab svg{width:22px;height:22px;flex:none}
.tab span{display:none}
.tab[aria-current="page"]{background:var(--coral);color:var(--ink)}
.tab[aria-current="page"] span{display:inline}

/* ---------- estructura ---------- */
.wrap{padding-left:var(--gut);padding-right:var(--gutr)}
.sec{display:flex;flex-direction:column;gap:12px;padding-block:26px 4px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.h-sec{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.01em;margin:0;line-height:1.15;text-wrap:balance}
.h-big{font-family:var(--display);font-weight:800;font-size:29px;letter-spacing:-.02em;margin:0;line-height:1.1}
.link{border:0;background:none;padding:10px 0;color:var(--ink);font-weight:800;font-size:15px;text-decoration:underline;text-decoration-color:var(--coral);text-decoration-thickness:3px;text-underline-offset:4px}
.page-title{padding-block:14px 8px}
.page-title h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;margin:0;letter-spacing:-.02em}
.page-title .muted{margin-top:6px}
.page-title.row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}

/* ---------- figuritas ---------- */
.stk{--r:-4deg;display:block;border:0;padding:9px;background:#fff;border-radius:30px;box-shadow:0 4px 8px rgba(14,27,61,.1),0 22px 44px rgba(14,27,61,.22);transform:rotate(var(--r));overflow:hidden}
.stk>img,.stk>.ini{width:100%;height:100%;object-fit:cover;object-position:center 30%;border-radius:22px}
.stamp{animation:stamp .55s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes stamp{0%{opacity:0;transform:scale(1.18) rotate(var(--r,0deg))}60%{opacity:1;transform:scale(.97) rotate(var(--r,0deg))}100%{transform:scale(1) rotate(var(--r,0deg))}}
.ini{display:grid;place-items:center;color:var(--ink);font-family:var(--display);font-weight:800;font-size:46px;background:var(--sky)}
.ini.bg0{background:var(--sky)} .ini.bg1{background:var(--peach)} .ini.bg2{background:var(--lav)} .ini.bg3{background:var(--sun)} .ini.bg4{background:var(--mint)} .ini.bg5{background:#FFB3C7}
.pill-sun{background:var(--sun);color:var(--ink);border-radius:999px;padding:4px 12px;font-family:var(--display);font-weight:800;font-size:15px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px}
.pill.dark{background:var(--ink);color:#fff}
.pill.coral{background:var(--coral);color:var(--ink)}
.pill-live{display:inline-flex;align-items:center;gap:8px;background:var(--coral);color:var(--ink);border-radius:999px;padding:6px 14px;font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.04em}
.pill-live i{width:9px;height:9px;border-radius:50%;background:var(--ink);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.2}}

/* ---------- inicio: el puntero ---------- */
.hero-stk{position:relative;height:356px;margin-top:2px}
.hero-stk .stk{position:absolute;left:16%;top:16px;width:68%;max-width:270px;height:268px;--r:-5deg}
.badge1{position:absolute;left:4%;top:0;z-index:2;width:90px;height:90px;border-radius:50%;background:var(--coral);transform:rotate(-10deg);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 0 5px #fff,0 10px 20px rgba(14,27,61,.2);--r:-10deg}
.badge1 b{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;color:#fff}
.badge1 span{font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.np{position:absolute;left:22%;top:262px;z-index:2;display:flex;align-items:center;gap:10px;max-width:74%;background:var(--ink);color:#fff;border-radius:999px;padding:10px 12px 10px 22px;box-shadow:0 10px 24px rgba(14,27,61,.3);transform:rotate(3deg);--r:3deg}
.np>span:first-child{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hero-cap{position:absolute;left:0;right:0;top:326px;text-align:center;margin:0;font-weight:700;color:var(--muted);font-size:15px}

/* ticket del domingo */
.ticket{display:flex;align-items:center;gap:16px;background:#fff;border-radius:30px;box-shadow:var(--shadow);padding:10px}
.cal{width:104px;height:112px;flex:none;border-radius:24px;background:var(--coral);display:flex;flex-direction:column;align-items:center;justify-content:center}
.cal span{font-weight:800;font-size:14px;letter-spacing:.1em;text-transform:uppercase}
.cal b{font-family:var(--display);font-weight:800;font-size:50px;line-height:1}
.t-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;padding-right:6px}
.t-info b{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.15}
.t-info .t-n{font-weight:800;font-size:14px}
.pbar{height:12px;border-radius:999px;background:var(--panel-2);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:999px;background:var(--ink)}
.anotado{display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:999px;padding:8px 18px 8px 8px}
.anotado .ok{width:48px;height:48px;border-radius:50%;background:var(--sun);color:var(--ink);display:grid;place-items:center;flex:none}
.anotado b{display:block;font-family:var(--display);font-weight:800;font-size:17px}
.anotado .sub{font-size:14px;color:#C9D6EE}
.anotado .link{color:#fff;margin-left:auto;padding:8px 0}

/* resultados */
.res{position:relative;display:block;width:100%;min-height:116px;border:0;border-radius:30px;background:var(--sun);color:var(--ink);text-align:left;padding:18px 150px 18px 20px;overflow:hidden}
.res b{display:block;font-family:var(--display);font-weight:800;font-size:19px}
.res .s{display:block;font-size:15px;font-weight:700;margin-top:4px}
.res .mini{position:absolute;top:20px;width:62px;height:74px;padding:4px;border-radius:16px;background:#fff;overflow:hidden}
.res .mini>img,.res .mini>.ini{width:100%;height:100%;object-fit:cover;border-radius:12px;font-size:20px}
.res .mini.a{right:66px;transform:rotate(-8deg)} .res .mini.b{right:16px;transform:rotate(7deg)}

/* ---------- botones ---------- */
.btn{height:56px;border:0;border-radius:999px;padding:0 22px;font-family:var(--display);font-weight:700;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;text-decoration:none;transition:transform .08s,box-shadow .08s}
.btn-p{background:var(--coral);color:var(--ink);box-shadow:0 5px 0 var(--coral-d)}
.btn-p:active{transform:translateY(4px);box-shadow:0 1px 0 var(--coral-d)}
.btn-big{height:68px;font-size:24px;font-weight:800;color:#fff;box-shadow:0 6px 0 var(--coral-d),0 14px 26px rgba(194,56,28,.3)}
.btn-big:active{transform:translateY(5px);box-shadow:0 1px 0 var(--coral-d)}
.btn-big .ball{width:30px;height:30px;border-radius:50%;background:var(--sun);box-shadow:inset 0 0 0 3px #fff;flex:none}
.btn-s{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.btn-d{background:transparent;color:var(--down);box-shadow:inset 0 0 0 2px var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.sm{height:46px;font-size:15px;width:auto;padding:0 18px}
.row-btns{display:flex;gap:10px}
.row-btns>*{flex:1}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:var(--panel-2);border-radius:26px;padding:6px}
.seg button{min-height:60px;border:0;border-radius:20px;background:transparent;color:var(--muted);font-family:var(--display);font-weight:800;font-size:16px}
.seg button small{display:block;font-family:var(--text);font-weight:700;font-size:12px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 4px 12px rgba(14,27,61,.12)}
.box{background:#fff;border-radius:24px;padding:14px 16px;box-shadow:var(--shadow)}

/* ---------- avatar ---------- */
.av{width:44px;height:44px;border-radius:50%;flex:none;background:var(--sky);color:var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px;overflow:hidden}
.av.c0{background:var(--sky)} .av.c1{background:var(--peach)} .av.c2{background:var(--lav)} .av.c3{background:var(--sun)} .av.c4{background:var(--mint)}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:60px;height:60px;font-size:22px}
.av.sm{width:30px;height:30px;font-size:12px}
.duo{display:flex;flex:none}
.duo .av{box-shadow:0 0 0 2px #fff}
.duo .av+.av{margin-left:-10px}

/* ---------- listas ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;min-height:62px;padding:8px 16px 8px 10px;border:0;border-radius:24px;background:#fff;width:100%;text-align:left;color:inherit;box-shadow:0 1px 2px rgba(14,27,61,.05)}
button.li:hover{box-shadow:0 0 0 2px var(--line-solid)}
.li .pos{width:30px;height:30px;flex:none;border-radius:50%;background:var(--panel-2);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:13px}
.li .who{flex:1;min-width:0}
.li .nm{display:block;font-weight:800;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .sub{display:block;font-size:13px;color:var(--muted)}
.li .end{font-size:13px;color:var(--muted);text-align:right;flex:none}
.li .pts{font-family:var(--display);font-weight:800;font-size:22px;text-align:right;min-width:44px}
.li.me{background:var(--ink);color:#fff}
.li.me .sub,.li.me .end{color:#C9D6EE}
.li.me .pos{background:var(--coral);color:var(--ink)}
.li.me .pts{color:var(--sun)}
.you{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;background:var(--sun);color:var(--ink);border-radius:999px;padding:1px 8px;margin-left:8px;vertical-align:2px}
.cut-row{display:flex;align-items:center;gap:10px;padding:4px 6px;font-weight:800;font-size:13px;color:var(--coral-d)}
.cut-row::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--coral)}
.cut-row::after{content:"";flex:1;height:0;border-top:2px dashed var(--coral)}
.count-line{display:flex;align-items:center;gap:12px}
.count-line b{font-family:var(--display);font-weight:800;font-size:40px;line-height:1}
.count-line span{font-weight:700;color:var(--muted)}

/* ---------- partidos ---------- */
.round{display:flex;flex-direction:column;gap:10px}
.match{display:flex;flex-direction:column;gap:4px;width:100%;border:0;border-radius:26px;padding:10px;background:#fff;text-align:left;color:inherit;box-shadow:var(--shadow)}
.m-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 6px 4px}
.m-h .st{font-weight:800;font-size:13px;color:var(--dim)}
.m-h .st.go{color:var(--coral-d);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.side{display:flex;align-items:center;gap:10px;min-height:48px;border-radius:18px;padding:4px 6px 4px 8px}
.side .nm{flex:1;min-width:0;font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .sc{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px;background:var(--panel-2);color:var(--muted)}
.side.win{background:var(--ink);color:#fff}
.side.win .sc{background:var(--sun);color:var(--ink)}
.side.win .duo .av{box-shadow:0 0 0 2px var(--ink)}
.side.lose .nm{color:var(--muted);font-weight:700}
.side.tbd .nm{color:var(--dim);font-weight:700;font-style:italic}
.side.tbd .sc{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.match.mine{box-shadow:0 0 0 3px var(--coral),var(--shadow)}
.next{position:relative;overflow:hidden;background:var(--ink);color:#fff;border-radius:30px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.next::after{content:"";position:absolute;right:-40px;top:-40px;width:130px;height:130px;border-radius:50%;background:var(--coral);opacity:.9}
.next>*{position:relative;z-index:1}
.next .k{font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--sun)}
.next .vs{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.2;max-width:88%}
.next .vs span{font-weight:600;color:#C9D6EE}

/* cuadro con líneas curvas */
.bracket{position:relative;height:240px}
.bk{position:absolute;width:33%;height:54px;background:#fff;border-radius:18px;box-shadow:0 1px 3px rgba(14,27,61,.08);padding:6px 10px;display:flex;flex-direction:column;justify-content:center;gap:1px;font-size:13px;line-height:1.25}
.bk .r{display:flex;justify-content:space-between;gap:6px;white-space:nowrap;overflow:hidden}
.bk .r span:first-child{overflow:hidden;text-overflow:ellipsis}
.bk .w{font-weight:800}
.bk .w span:last-child{background:var(--sun);border-radius:999px;padding:0 6px;font-weight:800}
.bk .l{color:var(--dim)}
.bk .t{color:var(--dim);font-style:italic}
.bk.mine{box-shadow:0 0 0 2px var(--coral)}
.bk.s{left:38.5%;width:27.5%}
.bk.f{left:71.5%;width:28.5%;height:auto;min-height:72px;padding-block:10px;border-radius:26px;background:var(--coral);color:var(--ink);align-items:center;text-align:center;box-shadow:0 5px 0 var(--coral-d)}
.bk.f b{font-family:var(--display);font-weight:800;font-size:20px;line-height:1}
.bk.f .kf{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;line-height:1.2}
.bk.f.done{background:var(--sun);box-shadow:0 5px 0 #C9A21C}
.cv{position:absolute;border:2.5px solid var(--line-solid);border-left:0;border-radius:0 16px 16px 0}
.cn{position:absolute;height:2.5px;background:var(--line-solid);border-radius:2px}

/* ---------- parejas ---------- */
.pairs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pair{--r:-1.5deg;background:#fff;border-radius:22px;padding:10px;display:flex;align-items:center;gap:10px;min-width:0;box-shadow:var(--shadow);transform:rotate(var(--r))}
.pair:nth-child(even){--r:1.5deg}
.pair .seed{width:28px;height:28px;flex:none;border-radius:50%;background:var(--panel-2);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:13px}
.pair .nm{font-weight:800;font-size:15px;line-height:1.25;min-width:0}
.pair .cab{background:linear-gradient(transparent 58%,var(--sun) 58%)}
.pair.mine{box-shadow:0 0 0 3px var(--coral),var(--shadow)}
.pair.mine .seed{background:var(--coral)}
.reveal .pair{animation:stamp .5s cubic-bezier(.2,.9,.3,1.3) both}

/* ---------- tabla ---------- */
.leader{position:relative;display:flex;align-items:center;gap:16px;width:100%;border:0;padding:16px;background:#fff;border-radius:32px;box-shadow:var(--shadow);text-align:left;color:inherit;overflow:hidden}
.leader::before{content:"";position:absolute;right:-50px;bottom:-60px;width:180px;height:170px;border-radius:55% 45% 50% 50%;background:var(--sun)}
.leader .stk{position:relative;width:128px;height:150px;flex:none;padding:6px;border-radius:24px;--r:-5deg}
.leader .stk>img,.leader .stk>.ini{border-radius:18px;font-size:40px}
.leader .tx{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.leader .n{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.05;letter-spacing:-.02em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leader .p{font-family:var(--display);font-weight:800;font-size:36px;line-height:1}
.leader .p small{font-size:15px;font-weight:700}
.leader .sub{font-size:13px;font-weight:700;color:var(--muted)}
.mv{font-size:12px;font-weight:800;width:28px;text-align:center;flex:none}
.mv.up{color:var(--up)} .mv.down{color:var(--down)} .mv.eq{color:var(--line-solid)}
.li.me .mv.up{color:#7CF0B0} .li.me .mv.down{color:#FFB3A3}
.tit{display:inline-flex;align-items:center;gap:2px;margin-left:8px;font-size:13px;vertical-align:1px;background:var(--sun);color:var(--ink);border-radius:999px;padding:1px 8px 1px 5px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips button{flex:none;height:42px;padding:0 16px;border:0;border-radius:999px;background:#fff;font-weight:800;font-size:14px;color:var(--muted);box-shadow:0 1px 3px rgba(14,27,61,.08)}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* ---------- álbum (plantel) ---------- */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.album{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pc{--r:-1.5deg;position:relative;border:0;padding:5px 5px 34px;border-radius:18px;background:#fff;box-shadow:var(--shadow);transform:rotate(var(--r));text-align:left;color:inherit;display:block;width:100%;max-width:100%}
.pc:nth-child(3n+2){--r:1.5deg}.pc:nth-child(3n){--r:-.5deg}
.pc .ph{aspect-ratio:4/4.8;max-width:100%;border-radius:14px;overflow:hidden}
.pc .ph>.ini{font-size:30px}
.pc .ph>img,.pc .ph>.ini{width:100%;height:100%;object-fit:cover}
.pc .cap{position:absolute;left:8px;right:6px;bottom:7px;display:flex;align-items:center;justify-content:space-between;gap:4px}
.pc .cap b{font-family:var(--display);font-weight:800;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pc .cap span{font-size:10px;font-weight:800;color:var(--muted);flex:none}
.pc .rkb{position:absolute;top:-6px;left:-6px;z-index:1;width:30px;height:30px;border-radius:50%;background:var(--coral);color:var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:11px;box-shadow:0 0 0 3px #fff}
.pc.mine{box-shadow:0 0 0 3px var(--coral),var(--shadow)}

/* ---------- ficha ---------- */
.ficha-top{position:relative;height:470px}
.ficha-top .stk{position:absolute;left:13%;top:30px;width:74%;max-width:300px;height:360px;--r:-3deg}
.ficha-top .badge1{top:12px;left:4%}
.ficha-top .badge1 b{font-size:24px}
.ficha-top .np{top:362px;left:16%}
.ficha-top .cap2{position:absolute;left:0;right:0;top:430px;text-align:center;font-weight:700;color:var(--muted)}
.back{position:absolute;z-index:3;top:4px;left:0;width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:var(--ink);display:grid;place-items:center;box-shadow:0 4px 12px rgba(14,27,61,.15)}
.edit-f{position:absolute;z-index:3;top:4px;right:0;height:44px;border:0;border-radius:999px;background:#fff;color:var(--ink);padding:0 18px;font-weight:800;font-size:15px;box-shadow:0 4px 12px rgba(14,27,61,.15)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stats>div{background:#fff;border-radius:22px;padding:12px 4px 10px;text-align:center;box-shadow:0 1px 3px rgba(14,27,61,.06)}
.stats>div:nth-child(2){background:var(--sun)}
.stats b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(17px,5.4vw,24px);line-height:1.1;white-space:nowrap}
.stats span{font-size:12px;color:var(--muted);font-weight:800}
.stats>div:nth-child(2) span{color:var(--ink)}
.titles{display:flex;gap:8px;flex-wrap:wrap}
.tt{display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:999px;padding:7px 16px;font-weight:800;font-size:14px}
.tt b{font-family:var(--display);font-size:18px;color:var(--sun)}
.champ{display:flex;align-items:center;gap:12px}
.champ .k{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.champ .v{font-family:var(--display);font-weight:800;font-size:17px;line-height:1.2}

/* ---------- fechas ---------- */
.fc{position:relative;background:#fff;overflow:hidden;width:100%;padding:16px;border:0;border-radius:30px;text-align:left;display:flex;flex-direction:column;gap:12px;color:inherit;box-shadow:var(--shadow)}
.fc .img{aspect-ratio:16/9;max-width:100%;border-radius:22px;overflow:hidden}
.fc .img img{width:100%;height:100%;object-fit:cover}
.fc .date{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1}
.duo-stk{position:relative;height:230px}
.duo-stk .stk{position:absolute;top:10px;width:48%;height:200px;padding:7px;border-radius:26px}
.duo-stk .stk>img,.duo-stk .stk>.ini{border-radius:20px}
.duo-stk .stk.a{left:2%;--r:-5deg} .duo-stk .stk.b{right:2%;--r:5deg;top:20px}
.duo-stk .ribbon{position:absolute;left:50%;bottom:-6px;z-index:2;transform:translateX(-50%) rotate(-2deg);background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-family:var(--display);font-weight:800;font-size:16px;white-space:nowrap;box-shadow:0 10px 24px rgba(14,27,61,.3)}
.duo-stk .ribbon small{display:block;font-family:var(--text);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sun);text-align:center}
.podium{display:flex;flex-direction:column;gap:14px}
.empty{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty .stk{width:100%;height:200px;--r:-2deg}
.hd{position:relative;padding-block:10px 4px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.hd h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.05;margin:0;letter-spacing:-.02em}
.hd p{margin:0;color:var(--muted);font-weight:700}
.hd.withback{padding-top:58px}

/* ---------- hoja inferior ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(14,27,61,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:#fff;border-radius:32px 32px 0 0;
  max-height:88vh;overflow:auto;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.9,.3,1.1);
  padding-block:10px calc(24px + env(safe-area-inset-bottom,0px));padding-left:var(--gut);padding-right:var(--gutr)}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line-solid);margin:0 auto 12px}
.sheet h3{font-family:var(--display);font-weight:800;font-size:26px;margin:4px 0 14px;letter-spacing:-.02em}
.sheet .stack{display:flex;flex-direction:column;gap:14px}
.sheet .li{background:var(--bg)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:14px;font-weight:800;color:var(--muted)}
.field input,.field select{height:52px;border:0;border-radius:18px;background:var(--bg);padding:0 16px;font-size:17px;width:100%;color:var(--ink);box-shadow:inset 0 0 0 2px transparent}
.field input:focus,.field select:focus{outline:none;box-shadow:inset 0 0 0 2px var(--coral)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .who{flex:1;min-width:0;font-weight:800;font-size:16px;line-height:1.2}
.stepper button{width:50px;height:50px;border:0;border-radius:50%;background:var(--bg);font-size:26px;font-weight:700}
.stepper output{font-family:var(--display);font-weight:800;font-size:38px;width:46px;text-align:center}
.pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pick button{border:0;border-radius:24px;background:var(--bg);padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:15px;min-height:104px}
.pick button:hover,.pick button.on{box-shadow:inset 0 0 0 3px var(--coral)}
.note{font-size:14px;color:var(--muted);background:var(--bg);border-radius:18px;padding:12px 14px}
.sharebox{white-space:pre-wrap;font-size:14px;background:var(--bg);border-radius:18px;padding:14px;max-height:240px;overflow:auto}
.toast{position:fixed;left:50%;top:calc(72px + env(safe-area-inset-top,0px));transform:translate(-50%,-12px);z-index:60;background:var(--ink);color:#fff;border-radius:999px;
  padding:12px 20px;font-weight:800;font-size:15px;opacity:0;pointer-events:none;transition:.25s cubic-bezier(.2,.9,.3,1.3);max-width:calc(100% - 32px);box-shadow:0 10px 24px rgba(14,27,61,.25)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.pts-t{width:100%;border-collapse:collapse;font-size:15px}
.pts-t td{padding:10px 0;border-top:1px solid var(--line)}
.pts-t td:last-child{text-align:right;font-family:var(--display);font-weight:800;font-size:20px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* estrellas: ligas ganadas */
.stars{color:#E9A100;font-size:.8em;letter-spacing:-.5px;margin-left:6px;vertical-align:1px;font-family:var(--text)}
.li.me .stars{color:var(--sun)}
.stars.big{margin-left:0;font-size:17px;flex:none}
.hero-cap .stars{font-size:15px;margin:0}
.leader .n .stars{font-size:18px;vertical-align:4px}
.pc .lig{position:absolute;top:-6px;right:-6px;z-index:1;min-width:30px;height:30px;padding:0 7px;border-radius:999px;background:var(--ink);color:var(--sun);display:grid;place-items:center;font-weight:800;font-size:12px;box-shadow:0 3px 8px rgba(14,27,61,.2)}
/* cuadro de 8: semis anchas y final */
.bk.s8{left:0;width:58%}
/* reglamento de copas */
.pts-t.m th{font-size:12px;font-weight:800;color:var(--muted);padding:0 0 6px;text-align:center}
.pts-t.m td:not(:first-child){text-align:center;font-family:var(--display);font-weight:800;font-size:19px;width:17%}
.lig-h{position:absolute;right:9%;top:6px;z-index:3;background:var(--ink);color:var(--sun);border-radius:999px;padding:7px 13px 8px;font-size:17px;letter-spacing:1px;line-height:1;transform:rotate(6deg);box-shadow:0 0 0 4px #fff,0 8px 18px rgba(14,27,61,.25)}
.copas-card{display:flex;flex-direction:column;gap:10px}
.copas-card .pts-t td{padding:9px 0}
</style>
</head>

const semNombre = k => (k.slice(-1) === "1" ? "1°" : "2°")+" semestre";
const semLabel = (k, ref) => semNombre(k)+(ref && ref.slice(0, 4) === k.slice(0, 4) ? "" : " "+k.slice(0, 4));
const semMeses = k => k.slice(-1) === "1" ? "de enero a junio" : "de julio a diciembre";
const prevSem = k => k.slice(-1) === "2" ? k.slice(0, 4)+"-S1" : (+k.slice(0, 4)-1)+"-S2";
const inPer = (fecha, k) => k === "all" || (k.includes("-S") ? semOf(fecha) === k : String(fecha).startsWith(k));
const quedan = fecha => { const k = semOf(fecha), fin = k.slice(0, 4)+(k.slice(-1) === "1" ? "-06-30" : "-12-31"); let n = 0; for(let t = fecha; t <= fin; t = addDays(t, 7)) n++; return n; };
const uid = () => "j"+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36);
function edad(nac){ if(!nac) return null; const b = pd(nac), t = new Date(); let a = t.getFullYear()-b.getFullYear(); if(t.getMonth()<b.getMonth() || (t.getMonth()===b.getMonth() && t.getDate()<b.getDate())) a--; return a; }
function cryptoRand(){ try{ const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0]/4294967296; }catch(e){ return Math.random(); } }
function seeded(s){ return function(){ s |= 0; s = s+0x6D2B79F5|0; let t = Math.imul(s^s>>>15, 1|s); t = t+Math.imul(t^t>>>7, 61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffle(a, R){ for(let i = a.length-1; i > 0; i--){ const j = Math.floor(R()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
const plural = (n, s, p) => n === 1 ? s : (p || s+"s");

   ===================================================================== */
const B16 = [
  {id:"Q1",r:"cuartos",n:"Cuartos 1",A:{p:"P1"},B:{p:"P8"}},
  {id:"Q2",r:"cuartos",n:"Cuartos 2",A:{p:"P4"},B:{p:"P5"}},
  {id:"Q3",r:"cuartos",n:"Cuartos 3",A:{p:"P3"},B:{p:"P6"}},
  {id:"Q4",r:"cuartos",n:"Cuartos 4",A:{p:"P2"},B:{p:"P7"}},
  {id:"S1",r:"semis",n:"Semifinal 1",A:{w:"Q1"},B:{w:"Q2"}},
  {id:"S2",r:"semis",n:"Semifinal 2",A:{w:"Q3"},B:{w:"Q4"}},
  {id:"F", r:"final",n:"Final Oro",A:{w:"S1"},B:{w:"S2"}},
  {id:"C1",r:"copa",n:"Semi Plata 1",A:{l:"Q1"},B:{l:"Q2"}},
  {id:"C2",r:"copa",n:"Semi Plata 2",A:{l:"Q3"},B:{l:"Q4"}},
  {id:"CF",r:"copa",n:"Final Plata",A:{w:"C1"},B:{w:"C2"}}
];
const B12 = [   // 6 parejas: las cabezas 1 y 2 pasan directo a semis; con 12 no hay Plata y suman solo los campeones Oro
  {id:"Q1",r:"cuartos",n:"Cuartos 1",A:{p:"P3"},B:{p:"P6"}},
  {id:"Q2",r:"cuartos",n:"Cuartos 2",A:{p:"P4"},B:{p:"P5"}},
  {id:"S1",r:"semis",n:"Semifinal 1",A:{p:"P1"},B:{w:"Q2"}},
  {id:"S2",r:"semis",n:"Semifinal 2",A:{p:"P2"},B:{w:"Q1"}},
  {id:"F", r:"final",n:"Final Oro",A:{w:"S1"},B:{w:"S2"}}
];
const B8 = [    // 4 parejas: semis y final
  {id:"S1",r:"semis",n:"Semifinal 1",A:{p:"P1"},B:{p:"P4"}},
  {id:"S2",r:"semis",n:"Semifinal 2",A:{p:"P2"},B:{p:"P3"}},
  {id:"F", r:"final",n:"Final Oro",A:{w:"S1"},B:{w:"S2"}}
];
const bracket = f => f.formato === 12 ? B12 : f.formato === 8 ? B8 : B16;
const mById = (f, id) => bracket(f).find(m => m.id === id);
const pairById = (f, id) => f.data.pairs.find(p => p.id === id);
const pairOfPlayer = (f, pid) => f.data.pairs.find(p => p.a === pid || p.b === pid);

function slotPair(f, s){
  if(s.p) return s.p;
  if(s.w || s.l){ const r = resultOf(f, mById(f, s.w || s.l)); return r ? (s.w ? r.w : r.l) : null; }
  return null;
}
const sides = (f, m) => [slotPair(f, m.A), slotPair(f, m.B)];
function resultOf(f, m){
  const r = f.data.res && f.data.res[m.id]; if(!r) return null;
  const [a, b] = sides(f, m); if(!a || !b || r[2] !== a || r[3] !== b) return null;
  const aw = r[0] > r[1];
  return {ga:r[0], gb:r[1], a, b, w: aw ? a : b, l: aw ? b : a};
}
function slotLabel(f, s){
  if(s.w || s.l){ const m = mById(f, s.w || s.l); return (s.w ? "Ganador " : "Perdedor ")+m.n.toLowerCase(); }
  return "A definir";
}
const pairName = (f, pid) => { const p = pairById(f, pid); return p ? nm(p.a)+" y "+nm(p.b) : ""; };

/* copas y puestos de una fecha: campeón y subcampeón según la cantidad de jugadores, y con 16 también el campeón Plata */
const PLACE_RANK = {"Campeón":9,"Subcampeón":8,"Campeón Copa":7,"Subcampeón Copa":6,"Semis":5,"Copa":4,"Cuartos":3};
const PLACE_TXT = {"Campeón":"Campeón Oro","Subcampeón":"Subcampeón","Campeón Copa":"Campeón Plata","Semis":"Semis","Copa":"Jugó la Plata","Cuartos":"Cuartos"};
const ptsOf = (P, k) => +(P && P[k]) || 0;
function calc(f){
  const P = f.data.pts || S.cfg.pts, fm = FORMATOS.includes(f.formato) ? f.formato : 16, f16 = fm === 16, out = {}, pod = {};
  f.data.pairs.forEach(p => [p.a, p.b].forEach(pid => out[pid] = {pts:0, w:0, j:0, place:"Cuartos"}));
  const each = (pairId, fn) => { const p = pairById(f, pairId); if(p) [p.a, p.b].forEach(pid => out[pid] && fn(out[pid])); };
  const place = (pairId, label) => each(pairId, o => { if(PLACE_RANK[label] > PLACE_RANK[o.place]) o.place = label; });
  for(const m of bracket(f)){
    const [a, b] = sides(f, m);
    if(m.r === "semis"){ if(a) place(a, "Semis"); if(b) place(b, "Semis"); }
    if(m.r === "copa"){ if(a) place(a, "Copa"); if(b) place(b, "Copa"); }
    const r = resultOf(f, m); if(!r) continue;
    each(r.a, o => o.j++); each(r.b, o => o.j++); each(r.w, o => o.w++);
    if(m.id === "F"){ pod.camp = r.w; pod.sub = r.l; place(r.w, "Campeón"); place(r.l, "Subcampeón"); each(r.w, o => o.pts += ptsOf(P, "c"+fm)); each(r.l, o => o.pts += ptsOf(P, "s"+fm)); }
    if(m.id === "CF" && f16){ pod.cc = r.w; place(r.w, "Campeón Copa"); each(r.w, o => o.pts += ptsOf(P, "p16")); }
  }
  return {pp: out, pod};
}

/* tabla de un semestre ("2026-S2"); "all" = histórico */
function ranking(sem, excludeFecha){
  const t = {};
  const row = pid => t[pid] || (t[pid] = {pid, pts:0, arr:0, fechas:0, w:0, j:0, camp:0, sub:0, cc:0, cs:0});
  S.players.forEach(p => { const r = row(p.id); if(+p.arrPts && (sem === "all" || String(p.arrSem || "") === sem)){ r.pts += +p.arrPts; r.arr += +p.arrPts; } });
  S.fechas.filter(f => f.estado === "cerrada" && f.fecha !== excludeFecha && inPer(f.fecha, sem)).forEach(f => {
    const c = calc(f);
    for(const pid in c.pp){ const o = c.pp[pid], r = row(pid); r.pts += o.pts; r.fechas++; r.w += o.w; r.j += o.j;
      if(o.place === "Campeón") r.camp++; if(o.place === "Subcampeón") r.sub++; if(o.place === "Campeón Copa") r.cc++; }
  });
  return Object.values(t).filter(r => { const p = pl(r.pid); return (p && p.activo !== false) || r.pts > 0; })
    .sort((x, y) => (y.pts-x.pts) || (y.camp-x.camp) || (y.sub-x.sub) || (y.cc-x.cc) || (y.w-x.w) || (ORD0(x.pid)-ORD0(y.pid)) || nm(x.pid).localeCompare(nm(y.pid)));
}
/* ligas ganadas: las de antes de la app más los semestres ya terminados */
let LIG = {s:null, k:null, v:{}};
function ligas(){
  const cur = semOf(targetSunday()); if(LIG.s === S && LIG.k === cur) return LIG.v;
  const v = {}; S.players.forEach(p => { if(+p.est) v[p.id] = +p.est; });
  const sems = new Set(cerradas().map(f => semOf(f.fecha)).concat(S.players.filter(p => +p.arrPts && p.arrSem).map(p => p.arrSem)));
  [...sems].filter(k => k < cur).forEach(k => { const w = ranking(k)[0]; if(w && w.pts > 0) v[w.pid] = (v[w.pid] || 0)+1; });
  LIG = {s:S, k:cur, v}; return v;
}

/* "2 Oro · 1 subcampeonato · 1 Plata" */
function logros(r){
  const a = [];
  if(r.camp) a.push(`${r.camp} Oro`);
  if(r.sub) a.push(`${r.sub} ${plural(r.sub, "subcampeonato")}`);
  if(r.cc) a.push(`${r.cc} Plata`);
  return a.join(" · ");
}

/* sorteo: cabezas de serie (la mitad con más puntos) con compañero al azar, sin repetir parejas del domingo anterior */
function sortear(fecha, fmt, R){
  R = R || cryptoRand;
  const lista = signupsOf(fecha), jug = lista.slice(0, fmt).map(s => s.pid), sup = lista.slice(fmt).map(s => s.pid);
  // cabezas de serie: los que mejor están en la tabla del semestre, entre los anotados; al arrancar un semestre desempata el anterior
  const k = semOf(fecha), pts = {}, ant = {};
  ranking(k).forEach(r => pts[r.pid] = r.pts); ranking(prevSem(k)).forEach(r => ant[r.pid] = r.pts);
  const tb = {}; jug.forEach(pid => tb[pid] = R());
  const ord = jug.slice().sort((x, y) => ((pts[y]||0)-(pts[x]||0)) || ((ant[y]||0)-(ant[x]||0)) || (tb[x]-tb[y]));
  const half = fmt/2, cab = ord.slice(0, half), resto = ord.slice(half);
  const prev = new Set(); const lc = S.fechas.filter(f => f.estado === "cerrada" && f.fecha < fecha).sort((a, b) => b.fecha.localeCompare(a.fecha))[0];
  if(lc) lc.data.pairs.forEach(p => { prev.add(p.a+"|"+p.b); prev.add(p.b+"|"+p.a); });
  let best = null, bestRep = 99;
  for(let i = 0; i < 300 && bestRep > 0; i++){
    const s = shuffle(resto.slice(), R), rep = cab.reduce((n, c, k) => n+(prev.has(c+"|"+s[k]) ? 1 : 0), 0);
    if(rep < bestRep){ best = s; bestRep = rep; }
  }
  const pairs = cab.map((c, k) => ({id:"P"+(k+1), a:c, b:best[k], seed:k+1}));
  const data = {jugadores:jug, suplentes:sup, pairs, res:{}, ts:Date.now(), por:ME || null};
  return {fecha, formato:fmt, estado:"juego", data};
}

/* cargar un resultado: devuelve lo que hay que guardar y qué partidos quedan sin efecto porque cambió quién los jugaba */
function planResult(f, mid, ga, gb){
  const m = mById(f, mid), [a, b] = sides(f, m), res = Object.assign({}, f.data.res);
  if(ga == null) delete res[mid]; else res[mid] = [ga, gb, a, b];
  const g = Object.assign({}, f, {data: Object.assign({}, f.data, {res})}), clear = [];
  for(const x of bracket(f)){
    if(x.id === mid || !res[x.id]) continue;
    const [xa, xb] = sides(g, x);
    if(res[x.id][2] !== xa || res[x.id][3] !== xb){ clear.push(x.id); delete res[x.id]; }
  }
  return {set:{[mid]: ga == null ? null : [ga, gb, a, b]}, clear, res};
}

function freshDB(){
  return {rev:1, cfg:JSON.parse(JSON.stringify(DEFAULT_CFG)),

      arrSem: TABLA0.copas[s[0]] ? TABLA0.sem : "", arrPts: TABLA0.copas[s[0]] || 0, est: LIGAS0[s[0]] || 0})),
    signups:[], fechas:[], fotos:{}};
}
const ADMIN_OPS = {arrastre:1, sorteo:1, resultado:1, cerrar:1, reabrir:1, anular:1, cfg:1, quitar:1};
function applyOp(db, o, admin){
  if(ADMIN_OPS[o.a] && !admin) throw new Error("Esa acción es del organizador: falta el PIN.");
  const fx = () => db.fechas.find(f => f.fecha === o.fecha);
  switch(o.a){
    case "anotar":
      if(!db.signups.some(s => s.fecha === o.fecha && s.pid === o.pid)) db.signups.push({fecha:o.fecha, pid:o.pid, ts:Date.now(), por:o.por || ""});
      break;
    case "bajar": case "quitar":
      db.signups = db.signups.filter(s => !(s.fecha === o.fecha && s.pid === o.pid)); break;
    case "jugador": {
      const p = db.players.find(x => x.id === o.p.id), keep = ["nombre","completo","lado","nac","activo"];
      if(p){ keep.forEach(k => { if(k in o.p) p[k] = o.p[k]; }); if("est" in o.p && admin) p.est = +o.p.est || 0; }
      else db.players.push({id:o.p.id, nombre:o.p.nombre, completo:o.p.completo||"", lado:o.p.lado||"", nac:o.p.nac||"", activo:true, arrSem:"", arrPts:0, est:0});
      break; }
    case "arrastre": { const p = db.players.find(x => x.id === o.pid); if(p){ p.arrSem = o.sem; p.arrPts = +o.pts || 0; } break; }
    case "foto":
      if(!/^j:/.test(o.key) && !admin) throw new Error("Esa foto la sube el organizador.");
      if(o.data) db.fotos[o.key] = {v:Date.now(), d:o.data}; else delete db.fotos[o.key];
      break;
    case "sorteo":
      if(fx() && !o.force) throw new Error("Ya hay un sorteo para esa fecha.");
      db.fechas = db.fechas.filter(f => f.fecha !== o.fecha);
      db.fechas.push({fecha:o.fecha, estado:"juego", formato:o.formato, data:o.data}); break;
    case "resultado": {
      const f = fx(); if(!f) throw new Error("No encontré esa fecha."); if(f.estado === "cerrada") throw new Error("La fecha está cerrada. Reabrila para corregir.");
      f.data.res = f.data.res || {};
      for(const k in o.set){ if(o.set[k] == null) delete f.data.res[k]; else f.data.res[k] = o.set[k]; }
      (o.clear || []).forEach(k => delete f.data.res[k]); break; }
    case "cerrar": { const f = fx(); if(f){ f.estado = "cerrada"; f.data.pts = o.pts; f.data.cerrada = Date.now(); } break; }
    case "reabrir": { const f = fx(); if(f) f.estado = "juego"; break; }
    case "anular": db.fechas = db.fechas.filter(f => f.fecha !== o.fecha); break;
    case "cfg": db.cfg = o.cfg; break;
    default: throw new Error("Operación desconocida");
  }
}
const Local = {
  key: DEMO ? "p1618_vista1" : "p1618_local3", db:null,
  init(){ this.db = LS.get(this.key, null); if(!this.db){ this.db = freshDB(); this.save(); } },
  warned:false,
  save(){ if(!LS.set(this.key, this.db) && !this.warned){ this.warned = true; toast("Este dispositivo no deja guardar: los cambios duran hasta que cierres"); } },
  snap(){ const {fotos, ...rest} = this.db, d = JSON.parse(JSON.stringify(rest)), v = {}; for(const k in fotos) v[k] = fotos[k].v; d.fotos = v; return d; },

function normalize(st){

function resizeImage(file, maxW, maxH, crop){
  return new Promise((ok, bad) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      let sx = 0, sy = 0, sw = im.naturalWidth, sh = im.naturalHeight;
      if(crop){ const r = maxW/maxH; if(sw/sh > r){ const nw = sh*r; sx = (sw-nw)/2; sw = nw; } else { const nh = sw/r; sy = (sh-nh)/3; sh = nh; } }
      const k = Math.min(1, maxW/sw, maxH/sh), w = Math.round(sw*k), h = Math.round(sh*k);
      const c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(im, sx, sy, sw, sh, 0, 0, w, h);
      URL.revokeObjectURL(url);
      let q = .8, d = c.toDataURL("image/jpeg", q);
      while(d.length > 250000 && q > .35){ q -= .1; d = c.toDataURL("image/jpeg", q); }
      ok(d);
    };
    im.onerror = () => { URL.revokeObjectURL(url); bad(new Error("No pude leer esa imagen")); };
    im.src = url;
  });
}

function matchCard(f, m, myPair){

  const can = isAdmin() && a && b && f.estado === "juego";

    ${side(a, m.A, r && r.ga, r && r.w === a)}${side(b, m.B, r && r.gb, r && r.w === b)}</${tag}>`;

/* cuadro con llaves curvas: con 16, cuartos, semis y final; con 12, las cabezas 1 y 2 esperan en semis; con 8, semis y final */
function bracketView(f, myPair){
  const shortSlot = s => s.w || s.l ? (s.w ? "Gan. " : "Perd. ")+mById(f, s.w || s.l).n.replace("Cuartos", "4tos").replace("Semifinal", "semi").toLowerCase() : "A definir";
  const box = (id, cls, top) => {
    const m = mById(f, id), [a, b] = sides(f, m), r = resultOf(f, m);
    const mine = myPair && (a === myPair.id || b === myPair.id);
    const row = (pid, slot, g) => pid ? `<div class="r ${r ? (r.w === pid ? "w" : "l") : ""}"><span>${esc(pairName(f, pid))}</span><span>${r ? g : ""}</span></div>` : `<div class="r t"><span>${esc(shortSlot(slot))}</span><span></span></div>`;
    return `<div class="bk ${cls} ${mine ? "mine" : ""}" style="top:${top}px">${row(a, m.A, r && r.ga)}${row(b, m.B, r && r.gb)}</div>`;
  };
  const F = resultOf(f, mById(f, "F"));
  const cv = (l, t, h) => `<i class="cv" style="left:${l};top:${t}px;width:3%;height:${h}px"></i>`;
  const cn = (l, t, w) => `<i class="cn" style="left:${l};top:${t}px;width:${w}"></i>`;
  const finalBox = `<div class="bk f ${F ? "done" : ""}" style="top:86px"><span class="kf">${F ? "Campeones" : "Final"}</span><b>Oro</b><span style="font-size:12px;font-weight:800">${F ? esc(pairName(f, F.w)) : "Por jugar"}</span></div>`;
  if(f.formato === 8) return `<div class="bracket" aria-label="Cuadro del torneo">${box("S1", "s8", 30)}${box("S2", "s8", 158)}
    ${cv("58%", 57, 128)}${cn("61%", 120, "10.5%")}${finalBox}</div>`;
  const left = f.formato === 16
    ? box("Q1", "", 0)+box("Q2", "", 60)+box("Q3", "", 128)+box("Q4", "", 188)
      +cv("33%", 27, 60)+cn("36%", 56, "2.5%")+cv("33%", 155, 60)+cn("36%", 184, "2.5%")
    : box("Q2", "", 30)+box("Q1", "", 158)+cn("33%", 56, "5.5%")+cn("33%", 184, "5.5%");
  return `<div class="bracket" aria-label="Cuadro del torneo">${left}
    ${box("S1", "s", 30)}${box("S2", "s", 158)}
    ${cv("66%", 57, 128)}${cn("69%", 120, "2.5%")}
    <div class="bk f ${F ? "done" : ""}" style="top:86px"><span class="kf">${F ? "Campeones" : "Final"}</span><b>Oro</b><span style="font-size:12px;font-weight:800">${F ? esc(pairName(f, F.w)) : "Por jugar"}</span></div>
  </div>`;
}
function miPartido(f, myPair){
  const ms = bracket(f).filter(m => { const [a, b] = sides(f, m); return a === myPair.id || b === myPair.id; });
  const next = ms.find(m => !resultOf(f, m));
  const c = calc(f).pp[ME];
  let tx;
  if(next){
    const [a, b] = sides(f, next), rival = a === myPair.id ? b : a;
    tx = `<div class="k">Tu próximo partido: ${esc(next.n)}</div><div class="vs">${esc(nm(myPair.a))} y ${esc(nm(myPair.b))} <span>contra</span> ${rival ? esc(pairName(f, rival)) : "a definir"}</div>`;
  } else {
    const FRASE = {"Campeón":"Campeones Oro","Subcampeón":"Subcampeones","Campeón Copa":"Campeones Plata","Semis":"Llegaron a semis","Cuartos":"Quedaron en cuartos","Copa":"Jugaron la Plata"};
    tx = `<div class="k">Tu domingo</div><div class="vs">${esc(c ? FRASE[c.place] || c.place : "")}</div>`;
  }
  const P = S.cfg.pts, fm = f.formato, quien = [ptsOf(P, "c"+fm) && "el campeón", ptsOf(P, "s"+fm) && "el subcampeón", fm === 16 && ptsOf(P, "p16") && "el campeón Plata"].filter(Boolean);
  const pie = c && c.pts > 0 ? `Se llevan ${copas(c.pts)} para la liga`
    : next ? "Suman copas "+quien.join(", ").replace(/, ([^,]*)$/, " y $1") : "Esta vez no sumaron copas";
  return `<section class="sec" style="padding-top:14px"><div class="next">${tx}<div class="small" style="color:#C9D6EE">${pie}</div></div></section>`;
}

/* ---------- TABLA (liga semestral; de acá sale el campeón de la liga) ---------- */

  const rows = ranking(key), hay = rows.some(r => r.pts > 0);
  const lastF = cerradas().find(f => inPer(f.fecha, key));
  const prev = {}; if(lastF) ranking(key, lastF.fecha).forEach((r, i) => prev[r.pid] = i);
  const lbl = k => k === "all" ? "Histórico" : semLabel(k, cur);
  const q = quedan(targetSunday());
  const subt = hist ? "Todas las copas, desde el primer domingo" : pasado ? `Liga del ${semLabel(key)}, terminada` : `Liga ${semMeses(key)} · ${q === 1 ? "queda 1 domingo" : `quedan ${q} domingos`}`;

    return `<button class="li ${r.pid === ME ? "me" : ""}" onclick="openFicha('${r.pid}')"><span class="pos num">${i+1}</span>${av(r.pid)}
      <span class="who"><span class="nm">${esc(nm(r.pid))}${starsHTML(r.pid)}${r.pid === ME ? '<span class="you">Vos</span>' : ""}</span>${(sub => sub ? `<span class="sub">${sub}</span>` : "")([r.fechas && `${r.fechas} ${plural(r.fechas, "fecha")}`, logros(r)].filter(Boolean).join(" · "))}</span>

/* resultado de un partido */
let RS = null;
function sheetResultado(fecha, mid){
  const f = fechaOf(fecha), m = mById(f, mid), [a, b] = sides(f, m), r = resultOf(f, m);
  RS = {fecha, mid, ga: r ? r.ga : 0, gb: r ? r.gb : 0};
  const row = (pid, k) => `<div class="stepper">${duo(f, pid)}<span class="who">${esc(pairName(f, pid))}</span>
    <button type="button" onclick="rsStep('${k}',-1)" aria-label="Restar un game">−</button><output id="rs-${k}" class="num">${RS[k]}</output><button type="button" onclick="rsStep('${k}',1)" aria-label="Sumar un game">+</button></div>`;
  openSheet(`<h3>${esc(m.n)}</h3><div class="stack"><p class="muted small" style="margin:0">Cargá los games de cada pareja.</p>
    ${row(a, "ga")}${row(b, "gb")}
    <div id="rs-warn" class="note" hidden></div>
    <button class="btn btn-p" id="rs-ok" onclick="guardarResultado()">Guardar</button>
    ${r ? `<button class="btn btn-d" onclick="guardarResultado(true)">Borrar el resultado</button>` : ""}</div>`);
  rsCheck();
}
function rsStep(k, d){ RS[k] = Math.max(0, Math.min(9, RS[k]+d)); $("#rs-"+k).textContent = RS[k]; rsCheck(); }
function rsCheck(){
  const ok = RS.ga !== RS.gb; $("#rs-ok").disabled = !ok;
  const f = fechaOf(RS.fecha), w = $("#rs-warn");
  if(!ok){ w.hidden = false; w.textContent = "No puede haber empate: alguien tiene que ganar."; return; }
  const plan = planResult(f, RS.mid, RS.ga, RS.gb);
  if(plan.clear.length){ w.hidden = false; w.textContent = "Cambia quién pasa de ronda: se borra el resultado de "+plan.clear.map(id => mById(f, id).n.toLowerCase()).join(", ")+"."; }
  else w.hidden = true;
}
function guardarResultado(borrar){
  const f = fechaOf(RS.fecha), plan = planResult(f, RS.mid, borrar ? null : RS.ga, borrar ? null : RS.gb);
  f.data.res = plan.res; closeSheet(); render();
  send({a:"resultado", fecha:RS.fecha, set:plan.set, clear:plan.clear}, borrar ? "Resultado borrado" : "Resultado guardado");
}

  if(CLOUD){
    setInterval(() => { if(document.visibilityState === "visible" && !$("#sheet").classList.contains("on")) refresh(); }, 20000);
    document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") refresh(); });
  }
  document.addEventListener("keydown", e => { if(e.key === "Escape") closeSheet(); });
}
boot();

</script>
</body>
